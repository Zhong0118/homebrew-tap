name: Update PinNote cask
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update.py
      - name: Commit a changed cask
        run: |
          if ! git diff --quiet -- Casks/pinnote.rb; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Casks/pinnote.rb
            git commit -m 'Update PinNote cask'
            git push
          fi
